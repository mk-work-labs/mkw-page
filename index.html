<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Index | mkw-page</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script src="js/data.js"></script>
    <script type="text/babel" src="jsx/tweaks-panel.jsx"></script>
    <script type="text/babel" src="jsx/variations.jsx"></script>

    <script type="text/babel">
      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/ {
        radius: 16,
        density: "normal",
        accent: "cyan",
      }; /*EDITMODE-END*/

      function App() {
        const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
        const projects = window.PROJECTS;

        const styled = React.useMemo(() => {
          if (tweaks.accent === "mixed") return projects;
          return projects.map((p) => ({ ...p, accent: tweaks.accent }));
        }, [projects, tweaks.accent]);

        return (
          <>
            <V3Hologram
              projects={styled}
              density={tweaks.density}
              radius={tweaks.radius}
            />
            <footer className="site-foot">
              <span>© 2026 · HOSTED ON GITHUB PAGES</span>
              <span>BUILD 0xA1F · STATIC</span>
              <a
                href="https://github.com/username"
                target="_blank"
                rel="noopener"
                style={{
                  color: "oklch(0.85 0.18 200)",
                  textDecoration: "none",
                }}
              >
                GITHUB ↗
              </a>
            </footer>

            <TweaksPanel label="Tweaks">
              <TweakSection label="カードの形状">
                <TweakSlider
                  label="角丸"
                  value={tweaks.radius}
                  min={0}
                  max={32}
                  step={1}
                  unit="px"
                  onChange={(v) => setTweak("radius", v)}
                />
              </TweakSection>
              <TweakSection label="レイアウト密度">
                <TweakRadio
                  label="密度"
                  value={tweaks.density}
                  onChange={(v) => setTweak("density", v)}
                  options={[
                    { value: "tight", label: "Tight" },
                    { value: "normal", label: "Normal" },
                    { value: "loose", label: "Loose" },
                  ]}
                />
              </TweakSection>
              <TweakSection label="アクセントカラー">
                <TweakRadio
                  label="カラー"
                  value={tweaks.accent}
                  onChange={(v) => setTweak("accent", v)}
                  options={[
                    { value: "mixed", label: "Mixed" },
                    { value: "cyan", label: "Cyan" },
                    { value: "magenta", label: "Magenta" },
                    { value: "lime", label: "Lime" },
                  ]}
                />
              </TweakSection>
            </TweaksPanel>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
