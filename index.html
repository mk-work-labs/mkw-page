<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Index · GitHub Pages</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #02030a;
      }
      body {
        font-family: "Noto Sans JP", system-ui, sans-serif;
        color: #e6f1ff;
        overflow-x: hidden;
      }
      #root,
      .frame.v3 {
        min-height: 100vh;
      }
      .frame.v3 {
        width: 100%;
        height: auto;
        padding-bottom: 60px;
      }
      .v3-grid {
        padding-bottom: 40px;
      }
      /* Responsive grid for the live site */
      @media (max-width: 1100px) {
        .v3-grid {
          grid-template-columns: repeat(2, 1fr) !important;
        }
      }
      @media (max-width: 680px) {
        .v3-grid {
          grid-template-columns: 1fr !important;
          padding: 24px 20px 40px !important;
        }
        .v3-header {
          padding: 24px 20px 16px !important;
          flex-direction: column;
          align-items: flex-start !important;
          gap: 16px;
        }
        .v3-header .lhs h1 {
          font-size: 32px !important;
        }
        .v3-header .rhs {
          text-align: left !important;
        }
      }
      .site-foot {
        position: relative;
        z-index: 2;
        padding: 28px 40px 32px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.15em;
        color: #4a5670;
      }
      @media (max-width: 680px) {
        .site-foot {
          flex-direction: column;
          gap: 8px;
          padding: 24px 20px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script src="js/data.js"></script>
    <script type="text/babel" src="jsx/tweaks-panel.jsx"></script>
    <script type="text/babel" src="jsx/variations.jsx"></script>

    <script type="text/babel">
      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/ {
        radius: 16,
        density: "normal",
        accent: "cyan",
      }; /*EDITMODE-END*/

      function App() {
        const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
        const projects = window.PROJECTS;

        // Apply global accent override if user picks a single hue
        React.useEffect(() => {
          const root = document.documentElement;
          if (tweaks.accent === "mixed") {
            root.style.removeProperty("--force-accent");
          }
        }, [tweaks.accent]);

        // Override per-card accent when in single-hue mode
        const styled = React.useMemo(() => {
          if (tweaks.accent === "mixed") return projects;
          return projects.map((p) => ({ ...p, accent: tweaks.accent }));
        }, [projects, tweaks.accent]);

        return (
          <>
            <V3Hologram
              projects={styled}
              density={tweaks.density}
              radius={tweaks.radius}
            />
            <footer className="site-foot">
              <span>© 2026 · HOSTED ON GITHUB PAGES</span>
              <span>BUILD 0xA1F · STATIC</span>
              <a
                href="https://github.com/username"
                style={{
                  color: "oklch(0.85 0.18 200)",
                  textDecoration: "none",
                }}
              >
                GITHUB ↗
              </a>
            </footer>

            <TweaksPanel title="Tweaks">
              <TweakSection title="カードの形状">
                <TweakSlider
                  label="角丸"
                  value={tweaks.radius}
                  min={0}
                  max={32}
                  step={1}
                  unit="px"
                  onChange={(v) => setTweak("radius", v)}
                />
              </TweakSection>
              <TweakSection title="レイアウト密度">
                <TweakRadio
                  value={tweaks.density}
                  onChange={(v) => setTweak("density", v)}
                  options={[
                    { value: "tight", label: "Tight" },
                    { value: "normal", label: "Normal" },
                    { value: "loose", label: "Loose" },
                  ]}
                />
              </TweakSection>
              <TweakSection title="アクセントカラー">
                <TweakRadio
                  value={tweaks.accent}
                  onChange={(v) => setTweak("accent", v)}
                  options={[
                    { value: "mixed", label: "Mixed" },
                    { value: "cyan", label: "Cyan" },
                    { value: "magenta", label: "Magenta" },
                    { value: "lime", label: "Lime" },
                  ]}
                />
              </TweakSection>
            </TweaksPanel>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
